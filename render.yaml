services:
  - type: web
    name: eazy-erp-api
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/health # ← corregido

    # Migraciones antes de levantar la nueva versión
    preDeployCommand: alembic upgrade head

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString

      # ⚠️ OJO: Render solo inyecta DATABASE_URL (pooler de transacción).
      # Alembic necesita la URL del pooler de sesión (puerto 5432).
      # Ver nota abajo.
      - key: DATABASE_URL_MIGRATIONS
        sync: false # ← se configura a mano en el dashboard

      - key: REDIS_URL
        fromService:
          name: erp-cache
          type: redis
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: CORS_ORIGINS
        value: https://tu-app.vercel.app

databases:
  - name: erp-db
    plan: free
    region: oregon
