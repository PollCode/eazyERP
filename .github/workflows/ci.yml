name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs anteriores del mismo PR/rama cuando llega uno nuevo
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------
  # Detecta qué cambió para saltar jobs irrelevantes
  # ---------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            shared:
              - 'packages/**'

  # ---------------------------------------------------------------
  # API: lint con ruff
  # ---------------------------------------------------------------
  api-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies
        run: uv sync --frozen --no-install-project
      - name: Ruff check
        run: uv run ruff check src
      - name: Ruff format check
        run: uv run ruff format --check src

  # ---------------------------------------------------------------
  # API: verificar que las migraciones están al día con los modelos
  # ---------------------------------------------------------------
  api-alembic:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
      DATABASE_URL_MIGRATIONS: postgresql+psycopg://erp:erp@localhost:5432/erp_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies
        run: uv sync --frozen --no-install-project
      - name: Apply migrations
        run: uv run alembic upgrade head
      # Falla si hay un modelo nuevo sin migración generada.
      # Es el error más común en proyectos con SQLModel.
      - name: Alembic check
        run: uv run alembic check

  # ---------------------------------------------------------------
  # API: tests con pytest
  # ---------------------------------------------------------------
  api-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
      DATABASE_URL_MIGRATIONS: postgresql+psycopg://erp:erp@localhost:5432/erp_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies
        run: uv sync --frozen --no-install-project
      - name: Apply migrations
        run: uv run alembic upgrade head
      # Cuando aún no hay tests, pytest sale con código 5.
      # Lo tratamos como éxito para no bloquear el CI mientras
      # se escriben los primeros tests.
      - name: Run pytest
        run: |
          uv run pytest -q --exitfirst
        continue-on-error: false
        shell: bash
        # Nota: si prefieres que el job falle cuando no hay tests,
        # borra el bloque if de abajo y deja el run tal cual.
      - name: No-tests fallback
        if: failure()
        run: echo "Si ves 'no tests ran', añade tests en src/tests/"

  # ---------------------------------------------------------------
  # API: verificar que el Dockerfile construye
  # ---------------------------------------------------------------
  api-docker:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (sin push, solo verificación)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: false
          tags: eazy-erp-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # Web: lint y type check (cuando exista apps/web)
  # ---------------------------------------------------------------
  web-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Type check
        run: pnpm tsc --noEmit

  # ---------------------------------------------------------------
  # Web: build (Next.js)
  # ---------------------------------------------------------------
  web-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          # Placeholder: los secretos reales viven en Vercel.
          # Aquí solo se verifica que el build compila.
          NEXT_PUBLIC_API_URL: http://localhost:8000
