[project]
name = "eazy-erp-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.164.0",
    "sqlmodel>=0.0.50",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "main:app"
