[project]
name = "eazy-erp-api"
version = "0.1.0"
description = "API del ERP eazyERP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.164.0",
    "psycopg[binary]>=3.3.9",
    "redis>=8.1.0",
    "sqlmodel>=0.0.50",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
